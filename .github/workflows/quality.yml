# Quality workflow for the public clodBall release: lint and test the
# watcher. Trigger is workflow_dispatch only; the release process runs it.
name: quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watcher:
    name: watcher script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -s sh skills/clodBall/scripts/clodball-watch skills/clodBall/scripts/clodball-codex skills/clodBall/scripts/clodball-status bin/clodball-watch tests/test-watch.sh tests/test-codex.sh tests/test-status.sh
      - name: test
        run: sh tests/test-watch.sh
      - name: Codex launcher
        run: sh tests/test-codex.sh
      - name: Status report
        run: sh tests/test-status.sh
